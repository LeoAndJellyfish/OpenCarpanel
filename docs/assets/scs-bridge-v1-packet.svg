<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">OpenCarpanel SCS bridge version 1 packet layout</title>
  <desc id="desc">A textbook-style 44-byte array showing byte offsets and fields for magic, version, game, flags, session nonce, frame sequence, signed speed, RPM, RPM limit, displayed gear, throttle and brake.</desc>
  <defs>
    <pattern id="byte-grid" width="24.54545" height="76" patternUnits="userSpaceOnUse">
      <path d="M24.54545 0V76" stroke="#07090c" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1200" height="650" rx="28" fill="#07090c"/>
  <text x="58" y="64" fill="#f2f0e9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="42" font-weight="750">SCS bridge v1 · 44 字节数据包</text>
  <text x="58" y="101" fill="#899195" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1">FIXED LENGTH / LITTLE-ENDIAN / UDP 127.0.0.1:20777</text>

  <g id="byte-offsets" fill="#899195" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle">
    <text x="72.27" y="145">00</text><text x="96.82" y="145">01</text><text x="121.36" y="145">02</text><text x="145.91" y="145">03</text>
    <text x="170.45" y="145">04</text><text x="195.00" y="145">05</text><text x="219.55" y="145">06</text><text x="244.09" y="145">07</text>
    <text x="268.64" y="145">08</text><text x="293.18" y="145">09</text><text x="317.73" y="145">10</text><text x="342.27" y="145">11</text>
    <text x="366.82" y="145">12</text><text x="391.36" y="145">13</text><text x="415.91" y="145">14</text><text x="440.45" y="145">15</text>
    <text x="465.00" y="145">16</text><text x="489.55" y="145">17</text><text x="514.09" y="145">18</text><text x="538.64" y="145">19</text>
    <text x="563.18" y="145">20</text><text x="587.73" y="145">21</text><text x="612.27" y="145">22</text><text x="636.82" y="145">23</text>
    <text x="661.36" y="145">24</text><text x="685.91" y="145">25</text><text x="710.45" y="145">26</text><text x="735.00" y="145">27</text>
    <text x="759.55" y="145">28</text><text x="784.09" y="145">29</text><text x="808.64" y="145">30</text><text x="833.18" y="145">31</text>
    <text x="857.73" y="145">32</text><text x="882.27" y="145">33</text><text x="906.82" y="145">34</text><text x="931.36" y="145">35</text>
    <text x="955.91" y="145">36</text><text x="980.45" y="145">37</text><text x="1005.00" y="145">38</text><text x="1029.55" y="145">39</text>
    <text x="1054.09" y="145">40</text><text x="1078.64" y="145">41</text><text x="1103.18" y="145">42</text><text x="1127.73" y="145">43</text>
  </g>

  <g id="packet-array">
    <rect x="60" y="160" width="98.18" height="76" fill="#d9ff43"/>
    <rect x="158.18" y="160" width="98.18" height="76" fill="#9aae42"/>
    <rect x="256.36" y="160" width="196.36" height="76" fill="#39422a"/>
    <rect x="452.72" y="160" width="98.18" height="76" fill="#2c494d"/>
    <rect x="550.90" y="160" width="98.18" height="76" fill="#34616a"/>
    <rect x="649.08" y="160" width="98.18" height="76" fill="#406f75"/>
    <rect x="747.26" y="160" width="98.18" height="76" fill="#4d7774"/>
    <rect x="845.44" y="160" width="98.18" height="76" fill="#745848"/>
    <rect x="943.62" y="160" width="98.18" height="76" fill="#806c3c"/>
    <rect x="1041.80" y="160" width="98.20" height="76" fill="#8f553e"/>
    <rect x="60" y="160" width="1080" height="76" fill="url(#byte-grid)" stroke="#f2f0e9" stroke-width="2"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="800" text-anchor="middle">
      <text x="109.09" y="205" fill="#07090c">O C P \0</text>
      <text x="170.45" y="205" fill="#07090c">V</text>
      <text x="195.00" y="205" fill="#07090c">G</text>
      <text x="219.55" y="205" fill="#07090c">F</text>
      <text x="244.09" y="205" fill="#07090c">R</text>
      <text x="354.54" y="205" fill="#f2f0e9">SESSION NONCE</text>
      <text x="501.81" y="205" fill="#f2f0e9">FRAME</text>
      <text x="599.99" y="205" fill="#f2f0e9">SPEED</text>
      <text x="698.17" y="205" fill="#f2f0e9">RPM</text>
      <text x="796.35" y="205" fill="#f2f0e9">RPM MAX</text>
      <text x="894.53" y="205" fill="#f2f0e9">GEAR</text>
      <text x="992.71" y="205" fill="#f2f0e9">THROTTLE</text>
      <text x="1090.90" y="205" fill="#f2f0e9">BRAKE</text>
    </g>
    <path d="M48 160H42V236H48M1152 160H1158V236H1152" fill="none" stroke="#f2f0e9" stroke-width="3"/>
  </g>

  <g id="field-legend" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <g transform="translate(60 286)">
      <rect width="338" height="82" rx="14" fill="#0d1115" stroke="#2a3033"/>
      <rect x="18" y="18" width="8" height="46" rx="4" fill="#d9ff43"/>
      <text x="42" y="35" fill="#f2f0e9" font-size="20" font-weight="700">0–7 · Header</text>
      <text x="42" y="61" fill="#899195" font-size="18">magic / v1 / game / flags / reserved</text>
    </g>
    <g transform="translate(431 286)">
      <rect width="338" height="82" rx="14" fill="#0d1115" stroke="#2a3033"/>
      <rect x="18" y="18" width="8" height="46" rx="4" fill="#617024"/>
      <text x="42" y="35" fill="#f2f0e9" font-size="20" font-weight="700">8–15 · Session nonce</text>
      <text x="42" y="61" fill="#899195" font-size="18">每次插件初始化生成的会话标识</text>
    </g>
    <g transform="translate(802 286)">
      <rect width="338" height="82" rx="14" fill="#0d1115" stroke="#2a3033"/>
      <rect x="18" y="18" width="8" height="46" rx="4" fill="#42e8ff"/>
      <text x="42" y="35" fill="#f2f0e9" font-size="20" font-weight="700">16–19 · Frame sequence</text>
      <text x="42" y="61" fill="#899195" font-size="18">插件侧递增的 u32 帧序号</text>
    </g>

    <g transform="translate(60 390)">
      <rect width="338" height="82" rx="14" fill="#0d1115" stroke="#2a3033"/>
      <rect x="18" y="18" width="8" height="46" rx="4" fill="#42e8ff"/>
      <text x="42" y="35" fill="#f2f0e9" font-size="20" font-weight="700">20–23 · Speed</text>
      <text x="42" y="61" fill="#899195" font-size="18">f32，有符号 m/s；倒车为负</text>
    </g>
    <g transform="translate(431 390)">
      <rect width="338" height="82" rx="14" fill="#0d1115" stroke="#2a3033"/>
      <rect x="18" y="18" width="8" height="46" rx="4" fill="#42e8ff"/>
      <text x="42" y="35" fill="#f2f0e9" font-size="20" font-weight="700">24–31 · Engine</text>
      <text x="42" y="61" fill="#899195" font-size="18">f32 RPM + f32 RPM limit</text>
    </g>
    <g transform="translate(802 390)">
      <rect width="338" height="82" rx="14" fill="#0d1115" stroke="#2a3033"/>
      <rect x="18" y="18" width="8" height="46" rx="4" fill="#ffbd45"/>
      <text x="42" y="35" fill="#f2f0e9" font-size="20" font-weight="700">32–35 · Displayed gear</text>
      <text x="42" y="61" fill="#899195" font-size="18">i32；&lt;0 R、0 N、&gt;0 前进档</text>
    </g>

    <g transform="translate(60 494)">
      <rect width="524" height="82" rx="14" fill="#0d1115" stroke="#2a3033"/>
      <rect x="18" y="18" width="8" height="46" rx="4" fill="#ffbd45"/>
      <text x="42" y="35" fill="#f2f0e9" font-size="20" font-weight="700">36–39 · Effective throttle</text>
      <text x="42" y="61" fill="#899195" font-size="18">f32，严格限制在 0..1</text>
    </g>
    <g transform="translate(616 494)">
      <rect width="524" height="82" rx="14" fill="#0d1115" stroke="#2a3033"/>
      <rect x="18" y="18" width="8" height="46" rx="4" fill="#ff4b3e"/>
      <text x="42" y="35" fill="#f2f0e9" font-size="20" font-weight="700">40–43 · Effective brake</text>
      <text x="42" y="61" fill="#899195" font-size="18">f32，严格限制在 0..1</text>
    </g>
  </g>

  <text x="60" y="618" fill="#899195" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">V=version · G=game · F=flags · R=reserved · all integers and IEEE-754 float32 are little-endian</text>
</svg>

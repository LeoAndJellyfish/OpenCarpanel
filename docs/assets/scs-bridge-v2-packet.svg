<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">OpenSimDash SCS bridge version 2 packet layout</title>
  <desc id="desc">A textbook-style segmented array showing all byte ranges in the fixed 188-byte SCS bridge v2 datagram.</desc>
  <rect width="1200" height="760" rx="28" fill="#07090c"/>
  <text x="58" y="64" fill="#f2f0e9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="42" font-weight="750">SCS bridge v2 · 188 字节数据包</text>
  <text x="58" y="101" fill="#899195" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1">FIXED LENGTH / LITTLE-ENDIAN / UDP 127.0.0.1:20777</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="58" y="151" fill="#899195" font-size="17">0</text>
    <text x="1142" y="151" fill="#899195" font-size="17" text-anchor="end">43</text>
    <g transform="translate(58 164)">
      <rect width="196" height="72" fill="#d9ff43"/>
      <rect x="196" width="196" height="72" fill="#617024"/>
      <rect x="392" width="98" height="72" fill="#2c494d"/>
      <rect x="490" width="98" height="72" fill="#34616a"/>
      <rect x="588" width="98" height="72" fill="#406f75"/>
      <rect x="686" width="98" height="72" fill="#4d7774"/>
      <rect x="784" width="98" height="72" fill="#745848"/>
      <rect x="882" width="98" height="72" fill="#806c3c"/>
      <rect x="980" width="104" height="72" fill="#8f553e"/>
      <rect width="1084" height="72" fill="none" stroke="#f2f0e9" stroke-width="2"/>
      <g font-size="16" font-weight="800" text-anchor="middle">
        <text x="98" y="31" fill="#07090c">HEADER</text><text x="98" y="54" fill="#2b3115">0–7</text>
        <text x="294" y="31" fill="#f2f0e9">SESSION</text><text x="294" y="54" fill="#c8d793">8–15</text>
        <text x="441" y="43" fill="#f2f0e9">FRAME</text>
        <text x="539" y="43" fill="#f2f0e9">SPEED</text>
        <text x="637" y="43" fill="#f2f0e9">RPM</text>
        <text x="735" y="43" fill="#f2f0e9">RPM MAX</text>
        <text x="833" y="43" fill="#f2f0e9">GEAR</text>
        <text x="931" y="43" fill="#f2f0e9">THROTTLE</text>
        <text x="1032" y="43" fill="#f2f0e9">BRAKE</text>
      </g>
    </g>
    <text x="58" y="260" fill="#899195" font-size="15">v1-compatible base · version byte = 2</text>

    <text x="58" y="311" fill="#899195" font-size="17">44</text>
    <text x="1142" y="311" fill="#899195" font-size="17" text-anchor="end">91</text>
    <g transform="translate(58 324)">
      <rect width="90" height="76" fill="#234f58"/><rect x="90" width="90" height="76" fill="#2d6570"/><rect x="180" width="90" height="76" fill="#367b87"/>
      <rect x="270" width="90" height="76" fill="#5f642d"/><rect x="360" width="90" height="76" fill="#747a36"/><rect x="450" width="90" height="76" fill="#899040"/>
      <rect x="540" width="48" height="76" fill="#ba7d32"/><rect x="588" width="48" height="76" fill="#d19a3e"/>
      <rect x="636" width="90" height="76" fill="#69455d"/><rect x="726" width="90" height="76" fill="#7c526e"/><rect x="816" width="154" height="76" fill="#905f80"/><rect x="970" width="114" height="76" fill="#a36c91"/>
      <rect width="1084" height="76" fill="none" stroke="#f2f0e9" stroke-width="2"/>
      <g fill="#f2f0e9" font-size="14" font-weight="800" text-anchor="middle">
        <text x="45" y="32">NAV</text><text x="45" y="53">DIST</text>
        <text x="135" y="32">NAV</text><text x="135" y="53">TIME</text>
        <text x="225" y="32">SPEED</text><text x="225" y="53">LIMIT</text>
        <text x="315" y="32">FUEL</text><text x="315" y="53">NOW</text>
        <text x="405" y="32">FUEL</text><text x="405" y="53">CAP</text>
        <text x="495" y="32">FUEL</text><text x="495" y="53">RANGE</text>
        <text x="564" y="43">L</text><text x="612" y="43">S</text>
        <text x="681" y="32">DELIVERY</text><text x="681" y="53">TIME</text>
        <text x="771" y="32">PLANNED</text><text x="771" y="53">KM</text>
        <text x="893" y="43">INCOME · u64</text>
        <text x="1027" y="32">CARGO</text><text x="1027" y="53">MASS</text>
      </g>
    </g>
    <text x="58" y="426" fill="#899195" font-size="15">L = light bits · S = state bits · navigation/fuel/mass = float32</text>

    <text x="58" y="477" fill="#899195" font-size="17">92</text>
    <text x="1142" y="477" fill="#899195" font-size="17" text-anchor="end">187</text>
    <g transform="translate(58 490)">
      <rect width="361.33" height="82" fill="#253f45"/>
      <rect x="361.33" width="361.34" height="82" fill="#314e51"/>
      <rect x="722.67" width="361.33" height="82" fill="#3c5d5d"/>
      <rect width="1084" height="82" fill="none" stroke="#f2f0e9" stroke-width="2"/>
      <g fill="#f2f0e9" font-size="17" font-weight="800" text-anchor="middle">
        <text x="180.66" y="35">CARGO · UTF-8[32]</text><text x="180.66" y="60" fill="#93a9ad">92–123</text>
        <text x="542" y="35">SOURCE CITY · UTF-8[32]</text><text x="542" y="60" fill="#a4b6b8">124–155</text>
        <text x="903.34" y="35">DESTINATION CITY · UTF-8[32]</text><text x="903.34" y="60" fill="#b5c4c4">156–187</text>
      </g>
    </g>
  </g>

  <g transform="translate(58 626)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <rect width="1084" height="86" rx="16" fill="#0d1115" stroke="#2a3033"/>
    <text x="24" y="35" fill="#d9ff43" font-size="20" font-weight="750">解码规则</text>
    <text x="24" y="63" fill="#899195" font-size="18">version 决定精确长度；未知 bits、无效 UTF-8、NaN / Infinity 与非法负值一律拒绝。</text>
    <text x="1058" y="49" fill="#617024" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" text-anchor="end">NO STRUCT CAST · NO RAW RETAIN</text>
  </g>
</svg>

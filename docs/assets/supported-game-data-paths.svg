    <rect x="668" y="334" width="80" height="40" rx="9" fill="#0d1115" stroke="#3a4246"/>
    <text x="708" y="360" fill="#f2f0e9" text-anchor="middle">ets2</text>
    <rect x="776" y="334" width="80" height="40" rx="9" fill="#0d1115" stroke="#3a4246"/>
    <text x="816" y="360" fill="#f2f0e9" text-anchor="middle">ats</text>
  </g>
  <path d="M668 408H856" stroke="#3a4246" stroke-width="2"/>
  <text x="762" y="442" fill="#d9ff43" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700" text-anchor="middle">per-game reducer</text>
  <text x="762" y="473" fill="#899195" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" text-anchor="middle">sticky active source / 2 s</text>

  <rect x="962" y="132" width="196" height="480" rx="22" fill="#0d1115" stroke="#2a3033" stroke-width="2"/>
  <text x="1060" y="169" fill="#899195" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" text-anchor="middle">LOCAL CLIENT</text>
  <path d="M882 360H956" fill="none" stroke="#899195" stroke-width="3" marker-end="url(#gray-arrow)"/>
  <text x="920" y="338" fill="#899195" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" text-anchor="middle">paired WS</text>
  <rect x="1004" y="226" width="112" height="210" rx="25" fill="#14191d" stroke="#3a4246" stroke-width="2"/>
  <rect x="1021" y="249" width="78" height="127" rx="10" fill="#07090c" stroke="#899195"/>
  <g aria-hidden="true">
    <rect x="1031" y="263" width="12" height="5" rx="2" fill="#617024"/>
    <rect x="1047" y="263" width="12" height="5" rx="2" fill="#d9ff43"/>
    <rect x="1063" y="263" width="12" height="5" rx="2" fill="#d9ff43"/>
    <rect x="1079" y="263" width="12" height="5" rx="2" fill="#ff4b3e"/>
  </g>
  <text x="1060" y="324" fill="#f2f0e9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="38" font-weight="750" text-anchor="middle">7</text>
  <text x="1060" y="358" fill="#899195" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" text-anchor="middle">184 km/h</text>
  <circle cx="1060" cy="407" r="6" fill="#617024"/>
  <text x="1060" y="478" fill="#f2f0e9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Phone / iPad</text>
  <text x="1060" y="513" fill="#899195" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" text-anchor="middle">Dashboard + Editor</text>
  <text x="1060" y="548" fill="#899195" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" text-anchor="middle">HTTP 20778</text>

  <g transform="translate(58 650)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">

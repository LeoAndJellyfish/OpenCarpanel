  <text x="528" y="315" fill="#f2f0e9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" text-anchor="middle">bounded</text>
  <text x="528" y="344" fill="#f2f0e9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" text-anchor="middle">latest-state</text>
  <path d="M484 377H572" stroke="#3a4246" stroke-width="2"/>
  <text x="528" y="411" fill="#899195" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" text-anchor="middle">strict decode</text>
  <text x="528" y="443" fill="#899195" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" text-anchor="middle">no raw retain</text>

  <path d="M598 360H636" fill="none" stroke="#d9ff43" stroke-width="3" marker-end="url(#green-arrow)"/>
  <rect x="642" y="215" width="240" height="290" rx="17" fill="#14191d" stroke="#3a4246" stroke-width="2"/>
  <text x="762" y="255" fill="#f2f0e9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="700" text-anchor="middle">AdapterRegistry</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
    <rect x="668" y="282" width="80" height="40" rx="9" fill="#0d1115" stroke="#3a4246"/>
    <text x="708" y="308" fill="#f2f0e9" text-anchor="middle">f1-24</text>
    <rect x="776" y="282" width="80" height="40" rx="9" fill="#0d1115" stroke="#3a4246"/>

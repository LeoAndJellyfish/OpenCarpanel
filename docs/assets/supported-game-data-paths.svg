  <rect x="84" y="527" width="242" height="58" rx="12" fill="#18130b" stroke="#7b5d25"/>
  <text x="205" y="551" fill="#ffcf73" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700" text-anchor="middle">OpenCarpanel SCS plugin</text>
  <text x="205" y="575" fill="#c7ac79" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" text-anchor="middle">FRAME_END / 44 bytes</text>

  <rect x="430" y="132" width="484" height="480" rx="22" fill="#0d1115" stroke="#2a3033" stroke-width="2"/>
  <text x="454" y="169" fill="#899195" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">RUST HOST / ONE PROCESS</text>


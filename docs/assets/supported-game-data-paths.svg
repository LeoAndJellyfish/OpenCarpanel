<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">OpenCarpanel supported game data paths</title>
  <desc id="desc">F1 24 and F1 25 send native UDP directly to the Host. ETS2 and ATS invoke the SCS SDK bridge plugin, which sends a fixed loopback datagram to the same Host ingress. Every source becomes canonical telemetry and is published over a paired local WebSocket to a phone or iPad.</desc>
  <defs>
    <marker id="green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#d9ff43"/>
    </marker>
    <marker id="gray-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#899195"/>
    </marker>
  </defs>

  <rect width="1200" height="690" rx="28" fill="#07090c"/>
  <text x="58" y="66" fill="#f2f0e9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="42" font-weight="750">支持游戏的数据链路</text>
  <text x="58" y="101" fill="#899195" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1">GAME PROCESS → LOCAL HOST → PAIRED DASHBOARD</text>

  <rect x="42" y="132" width="340" height="480" rx="22" fill="#0d1115" stroke="#2a3033" stroke-width="2"/>
  <text x="66" y="169" fill="#899195" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">GAME PROCESS</text>

  <text x="66" y="216" fill="#d9ff43" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="700">Native UDP lane</text>
  <rect x="66" y="239" width="126" height="54" rx="12" fill="#14191d" stroke="#3a4246"/>
  <text x="129" y="273" fill="#f2f0e9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" text-anchor="middle">F1 24</text>
  <rect x="218" y="239" width="126" height="54" rx="12" fill="#14191d" stroke="#3a4246"/>
  <text x="281" y="273" fill="#f2f0e9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" text-anchor="middle">F1 25</text>
  <path d="M129 293V328H382M281 293V328" fill="none" stroke="#d9ff43" stroke-width="3" marker-end="url(#green-arrow)"/>
  <text x="66" y="352" fill="#899195" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">formats 2024 / 2025 / 2026</text>

  <path d="M66 384H344" stroke="#2a3033" stroke-width="2"/>
  <text x="66" y="426" fill="#ffbd45" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="700">SCS SDK bridge lane</text>
  <rect x="66" y="449" width="126" height="54" rx="12" fill="#14191d" stroke="#3a4246"/>
  <text x="129" y="483" fill="#f2f0e9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" text-anchor="middle">ETS2</text>
  <rect x="218" y="449" width="126" height="54" rx="12" fill="#14191d" stroke="#3a4246"/>
  <text x="281" y="483" fill="#f2f0e9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" text-anchor="middle">ATS</text>

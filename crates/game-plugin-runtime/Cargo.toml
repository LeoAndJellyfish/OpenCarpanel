[package]
name = "opencarpanel-game-plugin-runtime"
description = "Sandboxed runtime and package store for OpenCarpanel game plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
atomic-write-file = "0.3.0"
base64 = "0.22.1"
opencarpanel-adapter-api = { path = "../adapter-api" }
opencarpanel-game-plugin-api = { path = "../game-plugin-api" }
opencarpanel-telemetry-core = { path = "../telemetry-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
wasmi = { version = "1.1.0", default-features = false, features = ["std", "prefer-btree-collections"] }

[dev-dependencies]
tempfile = "3.27.0"
wat = "1.252.0"

[lints]
workspace = true

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">OpenCarpanel — local multi-game driving telemetry dashboard</title>
  <desc id="desc">F1 24, F1 25, Euro Truck Simulator 2 and American Truck Simulator feed a local Rust Host that publishes a paired dashboard to a phone or iPad.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#d9ff43"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="28" fill="#07090c"/>
  <path d="M0 1H1200" stroke="#2a3033" stroke-width="2"/>

  <g aria-hidden="true">
    <rect x="56" y="24" width="34" height="6" rx="3" fill="#617024"/>
    <rect x="96" y="24" width="34" height="6" rx="3" fill="#617024"/>
    <rect x="136" y="24" width="34" height="6" rx="3" fill="#617024"/>
    <rect x="176" y="24" width="34" height="6" rx="3" fill="#617024"/>
    <rect x="216" y="24" width="34" height="6" rx="3" fill="#617024"/>
    <rect x="256" y="24" width="34" height="6" rx="3" fill="#617024"/>
    <rect x="296" y="24" width="34" height="6" rx="3" fill="#d9ff43"/>
    <rect x="336" y="24" width="34" height="6" rx="3" fill="#d9ff43"/>
    <rect x="376" y="24" width="34" height="6" rx="3" fill="#ff4b3e"/>
  </g>

  <g id="title-block" transform="translate(58 64)">
    <text x="0" y="0" fill="#d9ff43" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="2">LOCAL / MULTI-GAME / LOW-LATENCY</text>
    <text x="0" y="78" fill="#f2f0e9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="70" font-weight="760" letter-spacing="-2">OpenCarpanel</text>
    <text x="0" y="126" fill="#c9cecb" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="26" font-weight="500">把电脑上的驾驶遥测，变成手机与 iPad 上的高帧率仪表盘。</text>
    <text x="0" y="166" fill="#899195" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21">One local Host. No cloud runtime. One paired dashboard.</text>

    <g transform="translate(0 214)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">
      <rect width="92" height="40" rx="10" fill="#14191d" stroke="#3a4246"/>
      <text x="46" y="26" fill="#f2f0e9" text-anchor="middle">F1 24</text>
      <rect x="104" width="92" height="40" rx="10" fill="#14191d" stroke="#3a4246"/>
      <text x="150" y="26" fill="#f2f0e9" text-anchor="middle">F1 25</text>
      <rect x="208" width="92" height="40" rx="10" fill="#14191d" stroke="#3a4246"/>
      <text x="254" y="26" fill="#f2f0e9" text-anchor="middle">ETS2</text>
      <rect x="312" width="92" height="40" rx="10" fill="#14191d" stroke="#3a4246"/>
      <text x="358" y="26" fill="#f2f0e9" text-anchor="middle">ATS</text>
    </g>

    <g transform="translate(0 286)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">
      <text x="0" y="0" fill="#899195">v0.1.0 PREVIEW</text>
      <circle cx="166" cy="-6" r="3" fill="#d9ff43"/>
      <text x="182" y="0" fill="#899195">26.65 ms synthetic p95</text>
    </g>
  </g>

  <g id="project-proof" transform="translate(728 60)">
    <rect x="0" y="0" width="414" height="302" rx="22" fill="#0d1115" stroke="#2a3033" stroke-width="2"/>
    <text x="24" y="34" fill="#899195" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="1">LIVE DATA PATH</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">
      <rect x="24" y="58" width="90" height="42" rx="9" fill="#14191d" stroke="#3a4246"/>
      <text x="69" y="85" fill="#f2f0e9" text-anchor="middle">F1 24</text>
      <rect x="24" y="110" width="90" height="42" rx="9" fill="#14191d" stroke="#3a4246"/>
      <text x="69" y="137" fill="#f2f0e9" text-anchor="middle">F1 25</text>
      <rect x="24" y="176" width="90" height="42" rx="9" fill="#14191d" stroke="#3a4246"/>
      <text x="69" y="203" fill="#f2f0e9" text-anchor="middle">ETS2</text>
      <rect x="24" y="228" width="90" height="42" rx="9" fill="#14191d" stroke="#3a4246"/>
      <text x="69" y="255" fill="#f2f0e9" text-anchor="middle">ATS</text>
    </g>

    <path d="M114 79H158M114 131H158M114 197H136V224H158M114 249H136V224" fill="none" stroke="#617024" stroke-width="3"/>
    <rect x="158" y="68" width="112" height="166" rx="16" fill="#10150d" stroke="#d9ff43" stroke-width="2"/>
    <text x="214" y="112" fill="#d9ff43" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" text-anchor="middle">RUST HOST</text>
    <text x="214" y="147" fill="#f2f0e9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" text-anchor="middle">adapter</text>
    <text x="214" y="176" fill="#f2f0e9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" text-anchor="middle">reducer</text>
    <text x="214" y="205" fill="#899195" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" text-anchor="middle">UDP 20777</text>

    <path d="M270 151H308" fill="none" stroke="#d9ff43" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="314" y="86" width="76" height="132" rx="17" fill="#14191d" stroke="#3a4246" stroke-width="2"/>
    <rect x="327" y="102" width="50" height="82" rx="7" fill="#07090c" stroke="#899195"/>
    <rect x="335" y="112" width="34" height="5" rx="2" fill="#d9ff43"/>
    <text x="352" y="146" fill="#f2f0e9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="700" text-anchor="middle">7</text>
    <text x="352" y="172" fill="#899195" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle">184</text>
    <circle cx="352" cy="201" r="4" fill="#617024"/>
    <text x="352" y="249" fill="#f2f0e9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="650" text-anchor="middle">PHONE</text>
    <text x="352" y="274" fill="#899195" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" text-anchor="middle">paired LAN</text>
  </g>
</svg>

[package]
name = "opencarpanel-host"
description = "Local OpenCarpanel host process"
build = "build.rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
atomic-write-file = "0.3.0"
base64 = "0.22.1"
futures-util = "0.3.34"
fs2 = "0.4.3"
getrandom = "0.3.4"
if-addrs = "0.15.0"
opencarpanel-adapter-api = { path = "../../crates/adapter-api" }
opencarpanel-adapter-f1 = { path = "../../crates/adapter-f1" }
opencarpanel-adapter-scs = { path = "../../crates/adapter-scs" }
opencarpanel-config = { path = "../../crates/config" }
opencarpanel-game-plugin-api = { path = "../../crates/game-plugin-api" }
opencarpanel-game-plugin-runtime = { path = "../../crates/game-plugin-runtime" }
opencarpanel-protocol = { path = "../../crates/protocol" }
opencarpanel-telemetry-core = { path = "../../crates/telemetry-core" }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
subtle = "2.6.1"
tempfile = "3.23.0"
tokio = { version = "1.53.1", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

[dev-dependencies]
tokio-tungstenite = "0.29.0"
wat = "1.252.0"

[lints]
workspace = true

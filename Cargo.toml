[workspace]
members = [
  "apps/desktop/src-tauri",
  "apps/host",
  "crates/adapter-api",
  "crates/adapter-f1",
  "crates/adapter-scs",
  "crates/config",
  "crates/game-plugin-api",
  "crates/game-plugin-runtime",
  "crates/game-plugin-sdk",
  "crates/protocol",
  "crates/telemetry-core",
  "examples/game-plugin-rust",
  "tools/telemetry-replay",
  "tools/game-plugin-cli",
]
resolver = "3"

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.91.1"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

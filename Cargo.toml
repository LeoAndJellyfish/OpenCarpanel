[workspace]
members = [
  "apps/host",
  "crates/adapter-api",
  "crates/adapter-f1",
  "crates/adapter-scs",
  "crates/config",
  "crates/protocol",
  "crates/telemetry-core",
  "tools/telemetry-replay",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[package]
name = "opencarpanel-game-plugin-cli"
description = "Developer validator and packer for .ocp-plugin files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "opencarpanel-plugin"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
opencarpanel-game-plugin-api = { path = "../../crates/game-plugin-api" }
opencarpanel-game-plugin-runtime = { path = "../../crates/game-plugin-runtime" }
serde_json = "1.0.151"
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.27.0"
wat = "1.252.0"

[lints]
workspace = true

name: Package preview

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust 1.91.1
        uses: dtolnay/rust-toolchain@1.91.1

      - name: Install locked web dependencies
        run: npm ci

      - name: Build and stage release directory
        run: npm run package:host

      - name: Smoke test packaged Host and all game inputs
        run: npm run test:package-smoke

      - name: Archive preview with executable permissions
        shell: pwsh
        run: |
          $packageDirectory = Get-ChildItem dist/release -Directory -Filter 'OpenCarpanel-*' | Select-Object -First 1
          if ($null -eq $packageDirectory) { throw 'Release directory was not created.' }
          $archive = "dist/release/opencarpanel-${{ runner.os }}-${{ runner.arch }}.tar.gz"
          tar -czf $archive -C dist/release $packageDirectory.Name

      - name: Upload unsigned preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: opencarpanel-${{ runner.os }}-${{ runner.arch }}
          path: dist/release/opencarpanel-*.tar.gz
          if-no-files-found: error
          retention-days: 14

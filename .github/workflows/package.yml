name: Release desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release source
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate tag and application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
          $appVersion = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($tagVersion -ne $appVersion) {
            throw "Tag version $tagVersion does not match desktop version $appVersion."
          }

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust 1.91.1
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: clippy, rustfmt

      - name: Install locked dependencies
        run: npm ci

      - name: Stage real desktop sidecar and game bridge
        run: npm run prepare:desktop

      - name: Check formatting, types, tests, and release Host
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check:web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run package:host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:package-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  publish:
    name: Bundle ${{ matrix.label }}
    needs: validate
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc"
          - label: macOS Apple Silicon
            platform: macos-15
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - label: macOS Intel
            platform: macos-15-intel
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust 1.91.1
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: ${{ matrix.target }}

      - name: Install locked dependencies
        run: npm ci

      - name: Build signed-update desktop bundles
        uses: tauri-apps/tauri-action@v1
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: OpenCarpanel v__VERSION__
          releaseBody: |
            OpenCarpanel v0.2.2 streamlines the desktop control center with concise labels, direct game-setting values, and less explanatory copy.

            See `docs/releases/v0.2.2.md` for the interface changes, compatibility, and validation notes.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: "OpenCarpanel_[version]_[platform]_[arch]_[bundle][setup][ext]"
          retryAttempts: 2

  verify-and-publish:
    name: Verify and publish release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify complete updater manifest and assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          ./tools/verify-desktop-release.ps1 `
            -Repository '${{ github.repository }}' `
            -Tag '${{ github.ref_name }}' `
            -ExpectedCommit '${{ github.sha }}' `
            -Publish
